name: Update ticker

# GitHub disables scheduled workflows after 60 days with no repo activity. If
# the ticker goes stale, check the Actions tab for a "workflow disabled" notice
# and re-enable it there; a manual run below also counts as activity.
on:
  schedule:
    - cron: "23 9 * * *"  # 09:23 UTC daily, off the hour to dodge the queue crush
  workflow_dispatch:

permissions:
  contents: write

# A manual run and the nightly one must never race to push the same file.
concurrency:
  group: update-ticker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fetch.py writes nothing until every figure validates, including the
      # check that per-club stints reproduce the index's own career line, so a
      # bad API response fails here and leaves the committed ticker untouched.
      - name: Fetch current figures
        run: python fetch.py

      # archive.json is watched too. It only moves when a player retires or a
      # pre-portal player is first matched, and both are worth a commit of
      # their own rather than being folded into a routine refresh.
      - name: Check whether anything moved
        id: diff
        run: |
          if git diff --quiet -- data.json archive.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change since the last run. Leaving the ticker alone."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --unified=0 -- data.json
            git --no-pager diff --stat -- archive.json
          fi

      # build.py validates the rendered markup and refuses to write on any
      # failure, so ticker.svg is either correct or untouched from the last run.
      - name: Rebuild the ticker
        if: steps.diff.outputs.changed == 'true'
        run: python build.py

      # After the build, so the committed-output test compares like with like.
      - name: Run the test suite
        if: steps.diff.outputs.changed == 'true'
        run: python -m unittest test_build -v

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          summary=$(python -c "import json; d=json.load(open('data.json')); a=json.load(open('archive.json')); print('%d active, %d archived' % (len(d['players']), len(a['players'])))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json archive.json ticker.svg
          git commit -m "chore: refresh ticker (${summary})"
          git push
